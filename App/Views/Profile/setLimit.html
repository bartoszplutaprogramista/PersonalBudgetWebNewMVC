{% extends 'base.html' %}

{% block title2 %}Ustaw limit{% endblock %}

{% block body2 %}
{% if set_limit_expense %}
<div class="row justify-content-center m-0 p-0">
    <div class="col-xl-12 col-xxl-9 p-0">
        <div class="content3 mt-2">
            <p class="p-content text-center p-3">Ustaw limit dla {{ set_limit_expense }}<b>
                    <div class="mt-1">
                        <div class="limit-input-size d-flex flex-column justify-content-center pb-4 text-center">
                            <div class="">
                                <form method="post" action="/profile/setLimitOfExpenseAction" id="setLimitForm"
                                    name="ExpSetLimit">
                                    <div class="mb-3">
                                        <label for="limitValue" class="form-label">Kwota (zł):</label>
                                        <input type="number" class="form-control" step="1" min="1" max="999999"
                                            id="limitValue" value="{{ limit_value }}"
                                            placeholder="{{ limit_value is null ? 'Limit nie ustawiony' }}"
                                            name="limitValue" onkeypress="return onlyNumberKey(event)" required>
                                    </div>
                                    <button type="submit" class="btn btn-warning">
                                        Ustaw
                                    </button>
                                </form>
                            </div>
                            <div class="mt-3">
                                <form action="/profile/categoryconfigurator" method="post">
                                    <button type="submit" class="btn btn-secondary">Anuluj</button>
                                </form>
                            </div>
                        </div>
                    </div>
        </div>
    </div>
</div>
{% endif %}
{% endblock %}
